repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(molecules/.*\.fcidump|.*\.ipynb)$
      - id: end-of-file-fixer
        exclude: ^(molecules/.*\.fcidump|.*\.ipynb)$
      - id: check-yaml
        exclude: ^molecules/.*\.yaml$

  - repo: local
    hooks:
      - id: verify-headers
        name: Verify IBM copyright headers
        entry: python tools/verify_headers.py
        language: system
        types: [python]
        pass_filenames: true

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff

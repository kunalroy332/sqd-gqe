# ferrocene -- d-block training molecule, generated by
# scripts/generate_dblock_molecules.py (32q). Active space window (16 orbitals)
# chosen via MP2 natural orbitals (see that script's module docstring for why --
# STO-3G was confirmed this session to misplace Co's 3d character onto near-empty
# virtuals; def2-svp fixes this). Genuinely closed-shell singlet in its real ground
# state (not spin-forced) -- verified via literature sourcing before generation.
#
# KNOWN LIMITATION: nelecas=10 does NOT match this window's own natural-orbital
# occupation numbers, which show 8 doubly-occupied-like orbitals (occ>1.0) in the
# 16-orbital window -- the natural choice would be nelecas=16, not 10. Unlike
# fe_cn6/co_nh3_6 (where nelecas=14 would still fit under FCI_DIM_LIMIT=5e7),
# ferrocene's natural nelecas=16 gives FCI dim ~1.66e8, WELL PAST the limit --
# there is no way to give this active space its chemically-correct electron count
# and still get an exact CASCI reference with a 16-orbital window. nelecas=10 was
# kept for consistency with fe_cn6/co_nh3_6 (deliberate tradeoff, not an oversight)
# specifically because it is the value that keeps CASCI tractable at all. Treat the
# CASCI number as a usable-but-approximate reference, not the exact answer this
# active space "should" give -- if exact-reference accuracy matters more than
# tractability for this molecule, use ccsd_t_energy() or an SQD self-convergence
# reference instead (same situation as molecules/large/SnOH3-me_L_*.yaml).
# CASCI E = -1641.139554 Ha (converged, FCI dim 1.908e+07, at nelecas=10 as above).

# fe_cn6 -- d-block training molecule, generated by
# scripts/generate_dblock_molecules.py (28q). Active space window (14 orbitals)
# chosen via MP2 natural orbitals (see that script's module docstring for why --
# STO-3G was confirmed this session to misplace Co's 3d character onto near-empty
# virtuals; def2-svp fixes this). Genuinely closed-shell singlet in its real ground
# state (not spin-forced) -- verified via literature sourcing before generation.
#
# KNOWN LIMITATION: nelecas=10 does NOT match this window's own natural-orbital
# occupation numbers, which show 7 doubly-occupied-like orbitals (occ>1.0) in the
# 14-orbital window -- i.e. the natural choice here would be nelecas=14, not 10.
# nelecas=10 was kept anyway for consistency with co_nh3_6/ferrocene (the other two
# d-block molecules generated alongside this one) -- deliberate, not an oversight,
# but the CASCI reference below reflects an active space with FEWER electrons than
# this window's own natural orbitals suggest is chemically appropriate. Treat the
# CASCI number as a usable-but-approximate reference, not the exact answer this
# active space "should" give.
# CASCI E = -1814.803886 Ha (converged, FCI dim 4.008e+06, at nelecas=10 as above).
_target_: sqd_gqe.core.system.MolecularSystem.from_fcidump
fcidump_path: molecules/dblock/fe_cn6_14o10e_mp2no_def2svp.fcidump
geometry:
  type: custom
  geometry: [
    ['Fe', [0.000000, 0.000000, 0.000000]],
    ['C', [1.920000, 0.000000, 0.000000]],
    ['C', [-1.920000, 0.000000, 0.000000]],
    ['C', [0.000000, 1.920000, 0.000000]],
    ['C', [0.000000, -1.920000, 0.000000]],
    ['C', [0.000000, 0.000000, 1.920000]],
    ['C', [0.000000, 0.000000, -1.920000]],
    ['N', [3.080000, 0.000000, 0.000000]],
    ['N', [-3.080000, 0.000000, 0.000000]],
    ['N', [0.000000, 3.080000, 0.000000]],
    ['N', [0.000000, -3.080000, 0.000000]],
    ['N', [0.000000, 0.000000, 3.080000]],
    ['N', [0.000000, 0.000000, -3.080000]],
  ]
basis: 'def2-svp'
spin: 0
charge: -4

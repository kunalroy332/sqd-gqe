# Benzene C6H6 — pi-system, common large QC benchmark. RHF singlet.
# Held-out for zero-shot transfer. Active space = 6 pi electrons in 6 pi orbitals.
_target_: sqd_gqe.core.system.MolecularSystem
geometry:
  type: custom
  geometry: [
    ['C', [ 0.000000,  1.396000, 0.000000]],
    ['C', [ 1.209000,  0.698000, 0.000000]],
    ['C', [ 1.209000, -0.698000, 0.000000]],
    ['C', [ 0.000000, -1.396000, 0.000000]],
    ['C', [-1.209000, -0.698000, 0.000000]],
    ['C', [-1.209000,  0.698000, 0.000000]],
    ['H', [ 0.000000,  2.479000, 0.000000]],
    ['H', [ 2.147000,  1.240000, 0.000000]],
    ['H', [ 2.147000, -1.240000, 0.000000]],
    ['H', [ 0.000000, -2.479000, 0.000000]],
    ['H', [-2.147000, -1.240000, 0.000000]],
    ['H', [-2.147000,  1.240000, 0.000000]],
  ]
basis: 'sto-3g'
nelecas: 6
norbcas: 6      # 12 qubits (pi active space) — held-out transfer target
spin: 0
charge: 0

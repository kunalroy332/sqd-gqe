# ni_cn4 -- HELD-OUT d-block validation molecule (NOT in the training pool),
# generated by scripts/generate_dblock_molecules.py --held-out (24q). A different
# 3d transition metal (Ni) from the 3 training d-block molecules (Fe/Co), for
# genuine cross-element zero-shot validation coverage. Active space window
# (12 orbitals) chosen via MP2 natural orbitals (see that script's module
# docstring for why -- STO-3G was confirmed this session to misplace Co's 3d
# character onto near-empty virtuals; def2-svp fixes this). Genuinely closed-shell
# singlet in its real ground state (not spin-forced) -- verified via literature
# sourcing before generation. Unlike the 3 training molecules, nelecas=12 here
# MATCHES the window's own natural occupation count exactly (no KNOWN LIMITATION
# mismatch) -- confirmed by HF > CASCI ordering coming out correct (-1875.564 Ha
# HF vs -1875.629 Ha CASCI, i.e. CASCI properly lower).
# CASCI E = -1875.629480 Ha (converged, FCI dim 8.538e+05, at nelecas=12 as above).
_target_: sqd_gqe.core.system.MolecularSystem.from_fcidump
fcidump_path: molecules/held_out_dblock/ni_cn4_12o12e_mp2no_def2svp.fcidump
geometry:
  type: custom
  geometry: [
    ['Ni', [0.000000, 0.000000, 0.000000]],
    ['C', [1.860000, 0.000000, 0.000000]],
    ['C', [-1.860000, 0.000000, 0.000000]],
    ['C', [0.000000, 1.860000, 0.000000]],
    ['C', [0.000000, -1.860000, 0.000000]],
    ['N', [3.020000, 0.000000, 0.000000]],
    ['N', [-3.020000, 0.000000, 0.000000]],
    ['N', [0.000000, 3.020000, 0.000000]],
    ['N', [0.000000, -3.020000, 0.000000]],
  ]
basis: 'def2-svp'
spin: 0
charge: -2

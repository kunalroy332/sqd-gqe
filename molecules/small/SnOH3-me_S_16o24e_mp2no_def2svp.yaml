# Sn(OH)3-Me, active space "S" (16o,24e) from Mitsubishi's MP2-NO-based
# selection (molecules/large/QC_2026-08-07_calc_MP2-NO-based-AS-Selection-SnOH3Me.pdf,
# page 2: MO18-33, 1-indexed). Loads pre-computed active-space integrals from
# the FCIDUMP (built on the imported Gaussian MP2 natural orbitals, not fresh
# HF canonical MOs -- see docs/report/snoh3_active_space_comparison.md: on
# this exact window, MP2-NO orbitals lower CASCI energy by ~63 mHa vs HF MOs).
#
# geometry/basis/ecp below are only used to rebuild the full-molecule HF (for
# hf.e_tot / ccsd_energy() reference-energy reporting in run.py) -- training
# and inference (operator_pool.py, pipeline.py) only ever read norb/nelec/
# active_hamiltonian, which come from the FCIDUMP, not from re-deriving a
# CASCI on this HF's canonical MOs.
#
# NOTE: ccsd_energy()/ccsd_t_energy() raise NotImplementedError for
# from_fcidump()-loaded systems (the active space here isn't a contiguous
# window of this HF's canonical MOs, so there's no frozen-core CCSD
# restriction to apply) -- do not list "R-CCSD" in reference_keys for this
# molecule. casci_energy() IS still valid (FCI dim = 3.3e6, well under
# FCI_DIM_LIMIT) since pyscf's FCI solver only needs h1/h2/norb/nelec.
_target_: sqd_gqe.core.system.MolecularSystem.from_fcidump
fcidump_path: molecules/small/SnOH3-me_S_16o24e_mp2no_def2svp.fcidump
geometry:
  type: custom
  geometry: [
    ['Sn', [0.02609710, 0.00023297, 0.00000503]],
    ['O', [-0.72960854, -0.88382672, -1.60694390]],
    ['O', [-0.73028565, -0.95136505, 1.56746013]],
    ['O', [-0.73429650, 1.83192239, 0.03919732]],
    ['C', [2.14616611, 0.00206624, 0.00035189]],
    ['H', [2.51047407, -0.89030332, 0.52481169]],
    ['H', [-1.38625841, -0.40089236, 2.01614545]],
    ['H', [2.50957444, 0.90258618, 0.51113774]],
    ['H', [2.51025081, -0.00565453, -1.03468371]],
    ['H', [-1.38487560, -1.54770593, -1.35281127]],
    ['H', [-1.38749167, 1.94407916, -0.66467107]],
  ]
basis: 'def2-svp'
ecp:
  Sn: 'def2-svp'
spin: 0
charge: 0

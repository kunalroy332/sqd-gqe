[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sqd-gqe"
version = "0.1.0"
description = "Sample-based quantum diagonalization (SQD) with a generative quantum eigensolver (GQE) policy that designs the state-preparation circuits."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [
    { name = "Kunal Kumar", email = "kunalkumar@ibm.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "torch>=2.11,<3",
    "pytorch-lightning>=2.6,<3",
    "scipy>=1.15,<2",
    "hydra-core>=1.3,<2",
    "omegaconf>=2.3,<3",
    "transformers>=4.57,<6",
    # Version ranges: the hardware runs of the accompanying study used qiskit 2.5.1, qiskit-ibm-runtime 0.49.0 and qiskit-addon-sqd 0.12.1.
    "qiskit>=2.5,<3",
    "qiskit-ibm-runtime>=0.49,<1",
    "qiskit-addon-sqd>=0.12,<0.13",
    "ffsim>=0.0.80,<1",
    "pyscf>=2.11,<3",
    "matplotlib>=3.8,<4",
    "wandb>=0.23.1,<1",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "pre-commit",
]

[tool.hatch.build.targets.wheel]
packages = ["sqd_gqe"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]   # syntax errors and undefined names; style rules are not enforced yet

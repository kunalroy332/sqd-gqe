[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sqd-gqe"
version = "0.1.0"
description = "Sample-based quantum diagonalization (SQD) with a generative quantum eigensolver (GQE) policy that designs the state-preparation circuits."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [
    { name = "Kunal Kumar", email = "kunalkumar@ibm.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "torch==2.11.0",
    "pytorch-lightning==2.6.1",
    "scipy~=1.15.3",
    "hydra-core==1.3.2",
    "omegaconf==2.3.0",
    "transformers==4.57.3",
    # qiskit and qiskit-ibm-runtime match the versions validated against real IBM Quantum hardware runs.
    "qiskit==2.5.1",
    "qiskit-ibm-runtime==0.49.0",
    "qiskit-addon-sqd==0.12.1",
    "ffsim>=0.0.80",
    "pyscf==2.11.0",
    "matplotlib>=3.8",
    "wandb>=0.23.1",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "pre-commit",
]

[project.urls]
Homepage = "https://github.ibm.com/ibm-q-research/sqd-gqe"
BugTracker = "https://github.ibm.com/ibm-q-research/sqd-gqe/issues"

[tool.hatch.build.targets.wheel]
packages = ["sqd_gqe"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["test", "tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]   # syntax errors and undefined names; style rules are not enforced yet
